<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Health Check Survey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">🌓</button>

    <div class="survey-container">
        <div class="header">
            <h1>Digital Health Check</h1>
            <p>Assess your online presence & claim your free digital audit.</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="step-counter" id="step-counter">Step 1 of 5 (20%)</div>

        <form id="survey-form" action="https://formsubmit.co/almas.razin.official@gmail.com" method="POST">
            <div class="form-step active" data-step="1">
                <h2>Step 1: Business Overview</h2>
                <div class="input-group">
                    <label for="biz-name">Business / Company Name *</label>
                    <input type="text" id="biz-name" required placeholder="Enter company name">
                </div>
                <div class="input-group">
                    <label for="industry">Industry / Sector *</label>
                    <select id="industry" required>
                        <option value="" disabled selected>Select industry</option>
                        <option value="ecom">E-commerce / Retail</option>
                        <option value="services">Professional Services</option>
                        <option value="tech">Tech / Software</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-step" data-step="2">
                <h2>Step 2: Digital Hurdles</h2>
                <div class="input-group">
                    <label>What is your biggest digital challenge right now? *</label>
                    <label class="checkbox-label"><input type="checkbox" name="challenge" value="traffic"> Low website traffic</label>
                    <label class="checkbox-label"><input type="checkbox" name="challenge" value="leads"> Poor lead conversion</label>
                    <label class="checkbox-label"><input type="checkbox" name="challenge" value="design"> Outdated website look</label>
                    <label class="checkbox-label"><input type="checkbox" name="challenge" value="social"> Weak social media footprint</label>
                </div>
            </div>

            <div class="form-step" data-step="3">
                <h2>Step 3: Current Platforms</h2>
                <div class="input-group">
                    <label for="current-site">Existing Website URL (If any)</label>
                    <input type="url" id="current-site" placeholder="https://example.com">
                </div>
                <div class="input-group">
                    <label>Which operational tools do you currently use?</label>
                    <label class="checkbox-label"><input type="checkbox" name="tools" value="crm"> CRM software</label>
                    <label class="checkbox-label"><input type="checkbox" name="tools" value="ads"> Meta / Google Ads</label>
                    <label class="checkbox-label"><input type="checkbox" name="tools" value="none"> None / Just starting</label>
                </div>
            </div>

            <div class="form-step" data-step="4">
                <h2>Step 4: Your Role</h2>
                <div class="input-group">
                    <label for="user-role">Your Position / Role *</label>
                    <select id="user-role" required onchange="toggleCustomRole()">
                        <option value="" disabled selected>Select your role</option>
                        <option value="owner">Founder / Owner</option>
                        <option value="manager">Marketing Manager</option>
                        <option value="custom">Other (Specify)</option>
                    </select>
                </div>
                <div class="input-group hidden" id="custom-role-group">
                    <label for="custom-role">Please specify your role *</label>
                    <input type="text" id="custom-role" placeholder="e.g., Operations Lead">
                </div>
            </div>

            <div class="form-step" data-step="5">
                <h2>Step 5: Secure Your Audit</h2>
                <div class="input-group">
                    <label for="contact-name">Full Name *</label>
                    <input type="text" id="contact-name" required placeholder="Your full name">
                </div>
                <div class="input-group">
                    <label for="contact-email">Work Email *</label>
                    <input type="email" id="contact-email" required placeholder="name@company.com">
                </div>
                <div class="input-group">
                    <label>Preferred Communication Method *</label>
                    <label class="radio-label"><input type="radio" name="comm" value="email" checked> Email</label>
                    <label class="radio-label"><input type="radio" name="comm" value="whatsapp"> WhatsApp</label>
                </div>
            </div>

            <div class="nav-buttons">
                <button type="button" id="prev-btn" class="btn btn-secondary hidden">Back</button>
                <button type="button" id="next-btn" class="btn btn-primary">Next</button>
                <button type="submit" id="submit-btn" class="btn btn-success hidden">Submit Survey</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
